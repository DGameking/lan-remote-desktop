name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（Node + Web）
        run: npm run typecheck

      - name: 类型检查（Vue SFC）
        run: npm run typecheck:vue

      - name: 单元测试（硬卡点）
        run: npm run test:unit

      - name: 打包 NSIS / portable（含三进程构建）
        run: npm run dist -- --x64

      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path dist -Filter *.exe -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
